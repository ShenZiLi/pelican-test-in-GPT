<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>鹈鹕测试 · 原创配乐渲染</title><style>body{font:18px system-ui;background:#18252a;color:#edf1e5;max-width:760px;margin:12vh auto}button,a{font:inherit;color:inherit}button{background:#385b61;padding:12px;border:1px solid #aec6c4}pre{white-space:pre-wrap}</style><h1>鹈鹕测试 · 原创程序配乐</h1><p>137 秒，48 kHz 双声道。全部音色由程序合成，无外部音频。</p><button id="render">合成并试听</button><pre id="status">等待渲染</pre><audio id="preview" controls style="width:100%"></audio><p><a id="download" hidden>下载 24-bit WAV</a></p><script type="module">
import {renderScore,encodeWav24} from './audio/render.js';
const status=document.querySelector('#status');window.audioEngine={ready:true,async render(){const result=await renderScore({onProgress:s=>{status.textContent=s;console.log(s);}});this.buffer=result.buffer;this.report=result.report;this.wav=encodeWav24(result.buffer);const url=URL.createObjectURL(new Blob([this.wav],{type:'audio/wav'}));document.querySelector('#preview').src=url;const link=document.querySelector('#download');link.href=url;link.download='pelican-score.wav';link.hidden=false;status.textContent=JSON.stringify({duration:result.report.duration,peak:result.report.peak,rms:result.report.rms},null,2);return result.report;},chunk(offset,length){const bytes=this.wav.subarray(offset,offset+length);let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(s);}};document.querySelector('#render').onclick=()=>window.audioEngine.render();
</script></html>
